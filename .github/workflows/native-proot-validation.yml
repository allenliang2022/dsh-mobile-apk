# Targeted source-branch validation and isolated emulator acceptance; never publishes a Release.
name: Native PRoot validation

on:
  push:
    branches: [feat/native-proot-debian]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Native PRoot review (${{ matrix.targetAbi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetAbi: arm64-v8a
            logicalAbi: arm64
            snapshotSha256: ed24dfcc004725dee4c41e6b9d139fa10e97455af270187794f838327caec28f
          - targetAbi: x86_64
            logicalAbi: x86_64
            snapshotSha256: 8409612269a56e7529da6527e153744c161a235be6679b2d3d5219d17f63be79
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # base/*.tar.xz is not needed; use the pinned public release snapshot below.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Offline launcher and gate fixtures, then source provenance/ELF gate
        run: |
          set -euo pipefail
          node scripts/tests/native-proot-launcher.test.mjs
          node scripts/tests/native-proot-gate.test.mjs
          python scripts/tests/native-proot-emulator-guard.test.py
          node scripts/check-native-proot.mjs --abi "${{ matrix.targetAbi }}"

      - name: Download and verify pinned public snapshot
        env:
          ABI: ${{ matrix.logicalAbi }}
          EXPECTED_SHA256: ${{ matrix.snapshotSha256 }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --max-time 600 \
            "https://github.com/kelai141/dsh-mobile-apk/releases/download/v0.14.0-preview/snapshot-${ABI}.tar.xz" \
            --output app/src/main/assets/snapshot.tar.xz
          printf '%s  %s\n' "$EXPECTED_SHA256" app/src/main/assets/snapshot.tar.xz | sha256sum --check --strict
          printf '%s\n' "$EXPECTED_SHA256" > app/src/main/assets/snapshot.sha256

      - name: JVM tests and single-ABI source APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace \
            -PtargetAbi="${{ matrix.targetAbi }}" -PversionNameSuffix=-native-proot-review

      - name: Verify actual APK before making a dev artifact
        id: verify_apk
        run: node scripts/check-native-proot.mjs --abi "${{ matrix.targetAbi }}" --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Diagnose source-asset member names after APK gate failure
        if: failure() && steps.verify_apk.outcome == 'failure'
        run: |
          python - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          if apk.is_file():
              with zipfile.ZipFile(apk) as archive:
                  for name in sorted(archive.namelist()):
                      if name.startswith("assets/native-proot-source/"):
                          print(name)
          else:
              print("APK unavailable; no native-proot-source members to inspect")
          PY

      - name: Upload JVM test reports even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-proot-junit-${{ matrix.targetAbi }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated dev APK (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: native-proot-review-${{ matrix.targetAbi }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: native-proot-instrumentation-${{ matrix.targetAbi }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  emulator-upgrade:
    name: Android 35 x86_64 host and upgrade acceptance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: native-proot-review-x86_64
          path: emulator-input/new
      - uses: actions/download-artifact@v4
        with:
          name: native-proot-instrumentation-x86_64
          path: emulator-input/tests
      - name: Verify source artifact and fetch pinned baseline
        run: |
          set -euo pipefail
          node scripts/check-native-proot.mjs --abi x86_64 --apk emulator-input/new/app-debug.apk
          mkdir -p emulator-input/old
          curl --fail --location --retry 3 --max-time 600 \
            https://github.com/kelai141/dsh-mobile-apk/releases/download/v0.13.8/dsh-mobile-apk-v0.13.8-x86_64.apk \
            --output emulator-input/old/baseline.apk
          printf '%s  %s\n' ceb3eed5f1b9577df56f68d30048cc30b1172cc6995d90995502a1bfa8ff8a13 emulator-input/old/baseline.apk | sha256sum --check --strict
      - name: Enable KVM for the throwaway runner emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated emulator upgrade and instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            python scripts/native-proot-emulator-smoke.py
            --serial emulator-5554
            --old-apk emulator-input/old/baseline.apk
            --old-sha256 ceb3eed5f1b9577df56f68d30048cc30b1172cc6995d90995502a1bfa8ff8a13
            --new-apk emulator-input/new/app-debug.apk
            --test-apk emulator-input/tests/app-debug-androidTest.apk
            --snapshot-sha256 8409612269a56e7529da6527e153744c161a235be6679b2d3d5219d17f63be79
            --out emulator-reports
      - name: Upload bounded technical acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-proot-emulator-upgrade-api35-x86_64
          path: emulator-reports/
          if-no-files-found: warn
          retention-days: 14

  emulator-api-boundary:
    name: Android API ${{ matrix.api }} helper boundary
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: native-proot-review-x86_64
          path: emulator-input/new
      - uses: actions/download-artifact@v4
        with:
          name: native-proot-instrumentation-x86_64
          path: emulator-input/tests
      - name: Enable KVM for the throwaway runner emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated API-boundary helper instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            python scripts/native-proot-emulator-smoke.py
            --helper-only
            --serial emulator-5554
            --new-apk emulator-input/new/app-debug.apk
            --test-apk emulator-input/tests/app-debug-androidTest.apk
            --out emulator-boundary-reports
      - name: Upload bounded API-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-proot-helper-api${{ matrix.api }}-x86_64
          path: emulator-boundary-reports/
          if-no-files-found: warn
          retention-days: 14
